<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">LUXURY</div>
  <nav class="menu">
    <a href="index.html">Shop</a>
    <a href="admin-edit.html" class="active">Admin</a>
  </nav>
</header>

<section class="add-page">

  <form id="addForm" class="add-card">
    <h3>Add New Product</h3>

    <input id="name" placeholder="Product name" required>

    <!-- ⭐ CATEGORY (ENUM SAFE) -->
    <select id="category" required>
      <option value="">Select category</option>
      <option value="Shirts">Shirts</option>
      <option value="Pants">Pants</option>
      <option value="Shoes">Shoes</option>
      <option value="Hats">Hats</option>
      <option value="Bags">Bags</option>
      <option value="Accessories">Accessories</option>
    </select>

    <input id="price" type="number" placeholder="Price (THB)" required>
    <input id="stock" type="number" placeholder="Stock" required>
    <input id="image" placeholder="Image path (/images/...)" required>

    <button type="submit" class="add-btn">Add Product</button>
  </form>

</section>

<script>
document.getElementById("addForm").addEventListener("submit", async e => {
  e.preventDefault();

  const res = await fetch("http://localhost:3000/products", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("name").value.trim(),
      category: document.getElementById("category").value,
      price: Number(document.getElementById("price").value),
      stock: Number(document.getElementById("stock").value),
      image: document.getElementById("image").value.trim()
    })
  });

  if (!res.ok) {
    const err = await res.text();
    alert("ADD FAILED: " + err);
    return;
  }

  alert("Added successfully");
  location.href = "admin.html";
});
</script>

</body>
</html>
