<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">LUXURY</div>
  <nav class="menu">
    <a href="index.html">Shop</a>
    <a href="cart.html">Cart</a>
    <a class="active">Checkout</a>
  </nav>
</header>

<section class="checkout-page">

  <!-- LEFT -->
  <form class="checkout-form" id="checkoutForm">
    <h3>Shipping Information</h3>

    <input id="fullname" placeholder="Full name" required>
    <input id="phone" placeholder="Phone number" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="address" placeholder="Address" required>
    <input id="city" placeholder="City" required>
    <input id="postcode" placeholder="Postal code" required>

    <button type="submit" class="checkout-btn">
      Place Order
    </button>
  </form>

  <!-- RIGHT -->
  <div class="checkout-summary">
    <h3>Order Summary</h3>
    <div id="checkout-items"></div>
    <p class="checkout-total" id="checkout-total">Total: 0 THB</p>
  </div>

</section>

<script>
/* ================= CONFIG ================= */
const API = "https://luxury-shop-backend.onrender.com";

/* ================= LOAD CART ================= */
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const itemsEl = document.getElementById("checkout-items");
const totalEl = document.getElementById("checkout-total");

let total = 0;
itemsEl.innerHTML = "";

if (cart.length === 0) {
  itemsEl.innerHTML = "<p style='opacity:.6'>Your cart is empty</p>";
} else {
  cart.forEach(item => {
    const sum = item.price * item.qty;
    total += sum;

    itemsEl.innerHTML += `
      <div class="checkout-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="checkout-info">
          <span class="checkout-name">${item.name}</span>
          <span class="checkout-qty">× ${item.qty}</span>
        </div>
        <strong>${sum.toLocaleString()} THB</strong>
      </div>
    `;
  });
}

totalEl.innerText = "Total: " + total.toLocaleString() + " THB";

/* ================= PLACE ORDER ================= */
document.getElementById("checkoutForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (cart.length === 0) {
    alert("Your cart is empty");
    return;
  }

  const btn = document.querySelector(".checkout-btn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  const orderData = {
    fullname: document.getElementById("fullname").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    city: document.getElementById("city").value,
    postcode: document.getElementById("postcode").value,
    cart
  };

  try {
    const res = await fetch(`${API}/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderData)
    });

    if (!res.ok) {
      throw new Error(await res.text());
    }

    localStorage.removeItem("cart");
    location.href = "success.html";
  } catch (err) {
    alert("Checkout failed");
    console.error(err);
    btn.disabled = false;
    btn.innerText = "Place Order";
  }
});
</script>

</body>
</html>
