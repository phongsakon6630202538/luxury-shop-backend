<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">LUXURY</div>
  <nav class="menu">
    <a href="admin.html">Back</a>
  </nav>
</header>

<section class="admin-section">
  <h2>Edit Product</h2>

  <input id="editName" placeholder="Product name">

  <select id="editCategory">
    <option value="Shirts">Shirts</option>
    <option value="Pants">Pants</option>
    <option value="Shoes">Shoes</option>
    <option value="Bags">Bags</option>
    <option value="Hats">Hats</option>
    <option value="Accessories">Accessories</option>
  </select>

  <input id="editPrice" type="number" placeholder="Price">
  <input id="editStock" type="number" placeholder="Stock">
  <input id="editImage" type="file" accept="image/*">

  <button onclick="saveEdit()">Save</button>
</section>

<script src="app.js" defer></script>
</body>
</html>
