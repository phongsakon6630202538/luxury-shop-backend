<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">LUXURY</div>
  <nav class="menu">
    <a href="index.html">Shop</a>
    <a href="admin-edit.html" class="active">Admin</a>
  </nav>
</header>

<section class="add-page">
  <form id="addForm" class="add-card">
    <h3>Add New Product</h3>

    <input id="name" placeholder="Product name" required>

    <select id="category" required>
      <option value="">Select category</option>
      <option value="Shirts">Shirts</option>
      <option value="Pants">Pants</option>
      <option value="Shoes">Shoes</option>
      <option value="Hats">Hats</option>
      <option value="Bags">Bags</option>
      <option value="Accessories">Accessories</option>
    </select>

    <input id="price" type="number" placeholder="Price (THB)" required>
    <input id="stock" type="number" placeholder="Stock" required>

    <!-- ✅ เลือกไฟล์รูป -->
    <input id="image" type="file" accept="image/*" required>

    <button type="submit" class="add-btn">Add Product</button>
  </form>
</section>

<script>
const API = "https://luxury-shop-backend.onrender.com";

document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData();
formData.append("name", name.value);
formData.append("category", category.value);
formData.append("price", price.value);
formData.append("stock", stock.value);
formData.append("image", image.files[0]); // 👈 ต้องมีจริง

  const res = await fetch(`${API}/products`, {
    method: "POST",
    body: formData
  });

  if (!res.ok) {
    alert("Add failed");
    return;
  }

  alert("Product added");
  location.href = "admin-edit.html";
});
</script>

</body>
</html>
